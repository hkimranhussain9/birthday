<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surprise for SwAti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=DM+Sans:wght@400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
<style>
/* ============ STYLE.CSS ============ */
:root{--ink:#25191d;--wine:#7b3944;--rose:#b85f68;--blush:#f2c6c4;--cream:#fff8ed;--paper:#f7ead7;--gold:#d6b48c;--muted:#7b6969;--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--ink);overflow-x:hidden;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:"DM Sans",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--cream);min-width:320px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}button{color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(184,95,104,.45);outline-offset:2px}
canvas{display:block}
.hidden{display:none!important}

/* ---- COUNTDOWN PAGE ---- */
.countdown-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;color:#fff;padding:20px;text-align:center;position:relative;z-index:9999}
.countdown-display{font-family:"DM Sans",sans-serif;font-size:clamp(50px,15vw,160px);font-weight:700;letter-spacing:4px;display:flex;gap:15px;flex-wrap:wrap;justify-content:center;line-height:1;text-shadow:0 0 30px rgba(236,72,153,0.7);margin-bottom:20px}
.countdown-display span.num{color:#ec4899}
.countdown-display span.label{font-size:clamp(14px,3vw,24px);color:#aaa;letter-spacing:2px}
.countdown-label{font-size:clamp(14px,3vw,22px);color:#aaa;margin-bottom:50px;letter-spacing:8px;text-transform:uppercase;font-weight:600}

/* ---- LOCK PAGE ---- */
.lock-screen-new{min-height:100svh;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#ff9a9e,#fad0c4);position:relative;overflow:hidden}
.lock-card-new{background:#fff;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);border-radius:16px;padding:24px;max-width:448px;width:100%;text-align:center;position:relative;z-index:2;animation:lockPopIn .7s cubic-bezier(.22,1,.36,1) both}
@media(min-width:640px){.lock-card-new{padding:32px}}
@keyframes lockPopIn{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.lock-card-new h1{font-size:clamp(28px,7vw,36px);font-weight:800;color:#ec4899;margin:0 0 16px;line-height:1.15}
.lock-card-new .intro{font-size:clamp(15px,3vw,18px);color:#374151;margin:0 0 24px;line-height:1.5}
.lock-card-new .emoji-row{font-size:clamp(40px,10vw,60px);margin-bottom:24px;line-height:1}
.lock-card-new .quote{color:#4b5563;font-style:italic;font-size:clamp(13px,2.8vw,16px);margin:0 0 24px;line-height:1.5}
.lock-card-new .surprise-btn{display:block;width:100%;padding:14px 24px;background:#ec4899;color:#fff;border:0;border-radius:12px;box-shadow:0 4px 14px rgba(236,72,153,.4);font-size:16px;font-weight:600;cursor:pointer;transition:background .2s ease,transform .15s ease,box-shadow .2s ease}
@media(min-width:640px){.lock-card-new .surprise-btn{width:auto;padding:12px 24px;display:inline-block}}
.lock-card-new .surprise-btn:hover{background:#db2777;transform:translateY(-2px);box-shadow:0 6px 18px rgba(236,72,153,.55)}
.lock-card-new .surprise-btn:active{transform:translateY(0)}
.lock-card-new #surprise-msg{margin-top:16px;font-size:clamp(16px,3.5vw,20px);font-weight:600;color:#9333ea;line-height:1.4}
.lock-card-new .surprise-pulse{animation:surprisePulse .6s ease}
@keyframes surprisePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* ---- Loading screen ---- */
.loading-screen{min-height:100svh;min-height:100vh;display:grid;place-content:center;justify-items:center;padding:24px;text-align:center;color:var(--cream);background:var(--ink);position:relative}
.loading-sticker{width:104px;height:104px;display:grid;place-items:center;position:relative;color:var(--rose);background:var(--cream);border-radius:43% 57% 62% 38%/51% 39% 61% 49%;animation:softSpin 3s ease-in-out infinite;font-size:44px}
.orbit{position:absolute;display:grid;place-items:center;color:var(--gold);animation:orbit 2.2s linear infinite}
.orbit-one{inset:-20px}.orbit-two{inset:-36px;animation-direction:reverse;animation-duration:3s}
.loading-screen h2{margin:36px 0 7px;font-family:"Cormorant Garamond",serif;font-size:clamp(26px,6vw,42px)}
.loading-screen p{margin:0;color:rgba(255,248,237,.65);font-size:13px}
.loading-track{width:min(280px,72vw);height:4px;margin-top:28px;overflow:hidden;background:rgba(255,255,255,.12)}
.loading-track span{display:block;width:100%;height:100%;background:var(--blush);transform-origin:left;animation:load 2.4s cubic-bezier(.22,.61,.36,1) both}

/* ---- Experience shell ---- */
.experience-shell{min-height:100svh;min-height:100vh;position:relative;overflow-x:hidden;display:flex;flex-direction:column;background:var(--cream)}
.experience-shell::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,248,237,.13) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(to bottom,black,transparent 85%);pointer-events:none}
.journey-header{height:clamp(56px,8vh,70px);padding:0 clamp(16px,4vw,58px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(37,25,29,.11);position:relative;z-index:20}
.music-button{border:0;background:none;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:clamp(10px,2.2vw,11px);text-transform:uppercase;letter-spacing:.12em;padding:6px 8px}
.page-stage{flex:1 1 auto;min-height:calc(100svh - 146px);display:flex;flex-direction:column;position:relative;z-index:2;animation:pageIn .7s cubic-bezier(.22,.61,.36,1) both}
.page-content{width:min(1200px,100%);flex:1 1 auto;margin:auto;padding:clamp(24px,5vw,60px) clamp(16px,4vw,60px);position:relative;display:flex;flex-direction:column;justify-content:center}
.page-nav{height:clamp(60px,9vh,76px);padding:0 clamp(16px,4vw,58px);padding-bottom:max(0px,var(--safe-bottom));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-top:1px solid rgba(37,25,29,.11);position:relative;z-index:20;background:rgba(255,248,237,.92);backdrop-filter:blur(12px)}
.nav-button{width:fit-content;padding:clamp(9px,2vh,12px) clamp(14px,3vw,20px);font-size:clamp(11px,2.2vw,12px);font-weight:600;border:0;cursor:pointer;display:inline-flex;justify-content:center;align-items:center;gap:9px;transition:transform .2s ease,box-shadow .2s ease}
.nav-button.secondary{background:transparent;border:1px solid #d9c8bb}
.nav-button.secondary:disabled{opacity:.25;cursor:default}
.nav-button.primary{justify-self:end;color:#fff;background:var(--wine);box-shadow:4px 4px 0 var(--blush)}
.nav-button.primary:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--blush)}
.page-label{text-align:center;line-height:1.15;padding:0 8px}
.page-label strong{font-family:"Cormorant Garamond",serif;font-size:clamp(15px,3.5vw,19px);white-space:nowrap}

/* ---- Section Intro ---- */
.section-intro{display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,3vw,28px);align-items:start;width:min(840px,100%);margin:0 auto clamp(20px,4vh,36px)}
.section-intro.compact{margin-bottom:clamp(14px,3vh,24px)}
.section-intro h2{margin:0;font-family:"Cormorant Garamond",serif;font-size:clamp(28px,5.5vw,56px);font-weight:500;letter-spacing:-.035em;line-height:1.05}
.eyebrow{margin:0 0 8px;color:var(--rose);text-transform:uppercase;letter-spacing:.2em;font-size:clamp(10px,2.2vw,11px);font-weight:600}

/* ---- Welcome ---- */
.welcome-page{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:clamp(24px,5vw,80px)}
.date-stamp{position:absolute;top:clamp(16px,3vw,32px);right:clamp(16px,4vw,5vw);transform:rotate(3deg);padding:6px 12px;border:1px solid var(--rose);color:var(--wine);font:600 10px "DM Sans",sans-serif;letter-spacing:.15em;background:rgba(255,248,237,.8)}
.hero-copy{position:relative;z-index:2}
.hero-copy h1{margin:0;font-family:"Cormorant Garamond",serif;font-size:clamp(48px,8vw,104px);font-weight:500;letter-spacing:-.06em;line-height:.82}
.hero-copy h1 em{color:var(--rose);font-weight:600;font-style:normal}
.name-ribbon{width:fit-content;margin:clamp(16px,3vh,26px) 0 clamp(14px,2.5vh,22px);padding:8px clamp(16px,3vw,24px);color:var(--cream);background:var(--wine);transform:rotate(-2deg);font-family:"Cormorant Garamond",serif;font-size:clamp(24px,3.5vw,38px);letter-spacing:.09em;box-shadow:6px 6px 0 var(--blush)}
.hero-note{max-width:520px;color:var(--muted);line-height:1.75;font-size:clamp(13px,2.5vw,14.5px)}
.hero-art{aspect-ratio:.92;min-height:320px;max-height:480px;position:relative;display:grid;place-items:center}
.hero-art::before{content:"";position:absolute;width:74%;height:82%;border:1px solid var(--gold);background:var(--paper);transform:rotate(5deg);box-shadow:16px 20px 0 rgba(123,57,68,.09)}
.big-heart{width:min(240px,62%);aspect-ratio:1;display:grid;place-items:center;z-index:1;color:var(--rose);transform:rotate(-7deg);filter:drop-shadow(10px 13px 0 rgba(123,57,68,.11));font-size:120px;line-height:1}
.scribble{position:absolute;z-index:2;bottom:12%;right:4%;transform:rotate(-8deg);font:clamp(20px,4vw,28px) "Sacramento",cursive;color:var(--wine)}
.tape{position:absolute;z-index:3;width:82px;height:24px;background:rgba(214,180,140,.63);top:7%;left:17%;transform:rotate(-18deg)}
.mini-card{position:absolute;width:68px;height:68px;display:grid;place-items:center;z-index:3;color:var(--wine);background:#fffdf8;border:1px solid rgba(37,25,29,.12);box-shadow:6px 8px 0 rgba(123,57,68,.1);font-size:26px}
.mini-card-one{right:2%;top:18%;transform:rotate(11deg)}
.mini-card-two{left:4%;bottom:14%;transform:rotate(-12deg)}
.scroll-note{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:#a7958c;font-size:9px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}

/* ---- Envelope ---- */
.envelope-page{display:flex;flex-direction:column;align-items:center;justify-content:center}
.envelope-wrapper{display:flex;flex-direction:column;align-items:center;width:100%;position:relative}
.envelope{width:min(540px,90vw);height:clamp(240px,38vw,320px);margin:16px auto 0;padding:0;border:0;background:none;cursor:pointer;position:relative;perspective:1000px}
.envelope-back{position:absolute;inset:0;background:#e6c5ac;border-radius:4px;box-shadow:0 24px 55px rgba(58,35,38,.19)}
.envelope-back::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,50% 59%,100% 0);background:#f1d6be;transform-origin:top;transition:transform .7s ease;z-index:4}
.envelope.open .envelope-back::before{transform:rotateX(180deg);z-index:0}
.envelope-front{position:absolute;inset:0;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);background:#d9b392;z-index:3;display:grid;place-items:center;font-size:48px;color:var(--wine)}
.open-prompt{position:absolute;z-index:6;left:50%;bottom:clamp(34px,6vw,48px);transform:translateX(-50%);color:var(--cream);font-size:clamp(10px,2.4vw,11px);font-weight:600;text-transform:uppercase;letter-spacing:.18em;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(123,57,68,.75);border-radius:999px;white-space:nowrap}

/* ---- Letter ---- */
.letter-page{display:flex;flex-direction:column;align-items:center;justify-content:center}
.letter-card-wrapper{width:min(720px,100%);margin:0 auto;display:flex;flex-direction:column}
.letter-card{background:#fffdf8;border:1px solid rgba(123,57,68,.2);border-radius:6px;padding:clamp(24px,5vw,46px) clamp(20px,5vw,48px);box-shadow:0 20px 60px rgba(58,35,38,.12),8px 10px 0 rgba(242,198,196,.5);position:relative}
.letter-card::before{content:"";position:absolute;inset:8px;border:1px dashed rgba(184,95,104,.25);border-radius:3px;pointer-events:none}
.letter-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid rgba(123,57,68,.12)}
.letter-stamp{display:inline-flex;align-items:center;gap:8px;color:var(--wine);font:600 11px "DM Sans",sans-serif;letter-spacing:.15em;padding:4px 10px;border:1px solid var(--rose);border-radius:3px;background:rgba(242,198,196,.2)}
.letter-tag{display:inline-flex;align-items:center;gap:6px;color:var(--rose);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em}
.letter-body{position:relative;z-index:1}
.letter-salutation{font-family:"Cormorant Garamond",serif!important;font-size:clamp(20px,4vw,26px)!important;font-weight:600!important;color:var(--wine)!important;margin-bottom:14px!important}
.letter-body p{margin:12px 0;font-family:"Cormorant Garamond",serif;font-size:clamp(16px,3.2vw,19.5px);line-height:1.6;color:#2c2024}
.letter-sign{display:block;margin-top:clamp(16px,3vh,24px);color:var(--wine);font:clamp(24px,5vw,32px) "Sacramento",cursive}

.action-btn-full{display:block;width:100%;margin-top:20px;padding:14px;background:var(--wine);color:#fff;border:0;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;text-align:center;transition:transform .2s,box-shadow .2s;box-shadow:3px 3px 0 var(--blush)}
.action-btn-full:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--blush)}

/* Reply/Feedback Box */
.reply-box{margin-top:20px;padding:16px;background:#fffdf8;border:1px solid rgba(123,57,68,.2);border-radius:6px;display:none;animation:bdySlideIn .3s ease;text-align:left}
.reply-box.active{display:block}
.reply-input{width:100%;padding:12px;border:1px solid #d9c8bb;border-radius:6px;font-family:inherit;font-size:14px;resize:vertical;min-height:90px;margin-bottom:10px;background:#fff}
.reply-input:focus{outline:0;border-color:var(--rose)}
.reply-actions{display:flex;gap:10px;justify-content:flex-end}
.btn-sm{padding:8px 16px;font-size:12px;border-radius:4px;cursor:pointer;border:1px solid #d9c8bb;background:transparent;font-weight:600}
.btn-sm.primary{background:var(--wine);color:#fff;border-color:var(--wine)}

/* ---- Play (Scratch) ---- */
.play-page{display:flex;flex-direction:column;align-items:center;justify-content:center}
.game-solo-layout{width:min(580px,100%);margin:0 auto}
.game-card{padding:clamp(22px,4.5vw,40px);border:1px solid rgba(37,25,29,.12);background:#fffdf8;box-shadow:10px 12px 0 rgba(123,57,68,.08);border-radius:6px;text-align:center}
.game-tag{display:inline-flex;align-items:center;gap:7px;color:var(--rose);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.15em;margin-bottom:4px}
.game-card h3{margin:10px 0 16px;font-family:"Cormorant Garamond",serif;font-size:clamp(26px,5vw,38px);line-height:1.1}
.game-card>p{min-height:36px;color:var(--muted);font-size:13px;line-height:1.55;margin:12px 0}
.scratch-area{height:clamp(160px,30vh,210px);position:relative;overflow:hidden;border:8px solid var(--paper);border-radius:4px;margin:0 auto}
.scratch-prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:var(--wine);background:repeating-linear-gradient(45deg,#fff8ed,#fff8ed 12px,#f8e8dd 12px,#f8e8dd 24px)}
.scratch-prize .big{font-size:42px;line-height:1}
.scratch-prize strong{font-family:"Cormorant Garamond",serif;font-size:clamp(22px,4.5vw,30px)}
.scratch-prize span{font-size:11px;color:var(--muted);padding:0 10px}
.scratch-area canvas{width:100%;height:100%;position:absolute;inset:0;touch-action:none;cursor:crosshair}

/* ---- Chapter shared ---- */
.chapter-page{display:flex;flex-direction:column;align-items:center;width:100%}

/* ---- ATM ---- */
.atm-stage{position:relative;width:min(960px,100%);margin:0 auto;height:clamp(480px,calc(100svh - 165px),660px);max-height:calc(100vh - 165px);border-radius:8px;overflow:hidden;background:#0d0b0c;box-shadow:0 40px 90px rgba(20,10,12,.45);perspective:1500px;user-select:none;touch-action:none;display:flex;align-items:flex-end;justify-content:center}
.atm-stage::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,rgba(255,245,225,.18),transparent 60%);pointer-events:none}
.atm-machine{position:absolute;left:50%;bottom:0;width:min(390px,86%);max-height:98%;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 24px 28px rgba(0,0,0,.5));display:flex;flex-direction:column}
.atm-topper{position:relative;margin:0 auto;width:86%;padding:clamp(6px,1.2vh,9px) 0;text-align:center;color:#eafff6;font:600 clamp(10px,2vw,12.5px)/1 "DM Sans",sans-serif;letter-spacing:.28em;background:linear-gradient(180deg,#0f6b58,#084337);border-radius:6px 6px 0 0;border:1px solid rgba(255,255,255,.14);box-shadow:0 0 24px rgba(31,214,168,.35),inset 0 1px 0 rgba(255,255,255,.25);flex-shrink:0}
.atm-body{position:relative;padding:clamp(8px,1.5vh,14px) clamp(10px,2vw,15px);border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#6e757c 0%,#575e64 8%,#454b51 42%,#33383d 100%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset -14px 0 26px rgba(0,0,0,.38),inset 14px 0 20px rgba(255,255,255,.05)}
.atm-face{display:grid;grid-template-columns:clamp(16px,3.5vw,20px) 1fr clamp(16px,3.5vw,20px);gap:clamp(5px,1.2vw,8px);align-items:center}
.side-rail{display:grid;gap:clamp(6px,1.2vh,10px)}
.side-btn{position:relative;height:clamp(14px,2.2vh,19px);border:0;padding:0;border-radius:3px;cursor:pointer;background:linear-gradient(180deg,#cfd6db,#8d959b);box-shadow:0 2px 0 #4a5055,inset 0 1px 0 rgba(255,255,255,.7);transition:transform .1s ease,box-shadow .1s ease}
.side-btn:disabled{cursor:default;opacity:.5}
.side-btn:active{transform:translateY(2px);box-shadow:0 0 0 #4a5055}
.side-btn.armed{background:linear-gradient(180deg,#7df4cf,#14a37e);box-shadow:0 2px 0 #0a6853,0 0 14px rgba(31,214,168,.7)}
.atm-screen-frame{position:relative;padding:clamp(6px,1.2vh,10px);border-radius:5px;background:linear-gradient(180deg,#24282c,#14171a);box-shadow:inset 0 3px 10px rgba(0,0,0,.8)}
.atm-screen{position:relative;aspect-ratio:4/3;min-height:clamp(110px,20vh,150px);padding:clamp(6px,1.2vh,10px);overflow:hidden;border-radius:3px;color:#b8ffe6;font-family:"DM Sans",monospace;background:radial-gradient(ellipse at 50% 30%,#0d2f28,#04120f 75%);box-shadow:inset 0 0 40px rgba(0,0,0,.85),inset 0 0 70px rgba(24,255,190,.07);display:flex;flex-direction:column;justify-content:center;gap:5px;text-align:center}
.atm-screen h4{margin:0;font-size:clamp(11px,2.2vw,15px);letter-spacing:.1em;color:#d9fff2;line-height:1.2}
.atm-screen p{margin:0;font-size:clamp(9.5px,1.8vw,11px);letter-spacing:.05em;color:#7fe6c6;line-height:1.45}
.atm-screen small{font-size:clamp(8px,1.6vw,9.5px);letter-spacing:.12em;color:#55b79b}
.screen-fade{animation:screenFade .35s ease both}
@keyframes screenFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.atm-progress{height:7px;border:1px solid #2c7a65;background:#071a16}
.atm-progress span{display:block;height:100%;background:repeating-linear-gradient(90deg,#2ff0b6 0 7px,#0b3d33 7px 9px);transition:width .18s linear}
.pin-dots{display:flex;gap:10px;justify-content:center}
.pin-dots i{width:10px;height:10px;border-radius:50%;border:1px solid #2c7a65;display:block}
.pin-dots i.filled{background:#2ff0b6;box-shadow:0 0 8px #2ff0b6}
.atm-menu{display:grid;gap:4px;text-align:left}
.atm-menu-row{display:flex;width:100%;align-items:center;justify-content:space-between;gap:6px;font-size:clamp(9.5px,1.8vw,11px);letter-spacing:.06em;padding:3px 2px;border:0;border-bottom:1px dashed rgba(47,240,182,.2);background:transparent;color:inherit;font-family:inherit;text-align:left;cursor:pointer}
.atm-menu-row:hover{background:rgba(47,240,182,.16)}
.atm-menu-row b{color:#d9fff2;font-weight:500}
.atm-menu-row em{font-style:normal;color:#38c79f}
.atm-nav-row{display:flex;justify-content:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.atm-nav{border:1px solid rgba(47,240,182,.55);background:rgba(20,163,126,.18);color:#d9fff2;font:600 clamp(9px,1.6vw,10px)/1 "DM Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:3px;cursor:pointer}

<body>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
/* =====================================================
   ⚠️ এখানে আপনার তারিখ ও সময় সেট করুন (TARGET_DATE)
   ফরম্যাট: 'YYYY-MM-DDTHH:MM:SS'
   ===================================================== */
const TARGET_DATE = '2026-1-07T00:05:00'; 

const NAME = "SwAti";
const pages = ["Welcome", "Letter", "Play", "Memory ATM", "Cut the Cake", "Accept Gift"];

const TG_BOT_TOKEN = "8047100663:AAH9PD5wJL_iXh1ygocfPE4dfiFfiVFm55g";
const TG_CHAT_ID = "7335173906";

// Updated Photo Bank images
const MEMORIES = [
  { img: "https://drive.google.com/thumbnail?id=1qbiTO2HdU8us3q7vQY7XZfmB-PxZcMTU&sz=w1000", caption: "Favorite Photo ❤️" },
  { img: "https://drive.google.com/thumbnail?id=1YPnvn82qi31URbNiPHO5Lu0yY_EVx8fZ&sz=w1000", caption: "Looking Good ✨" },
  { img: "https://drive.google.com/thumbnail?id=1oI9eSlLSzZfp4pudboah5icBJ6v_joQN&sz=w1000", caption: "Just Vibing 🌙" },
  { img: "https://drive.google.com/thumbnail?id=160N0X18uUH7s9bHiWiWcahRAH5utursa&sz=w1000", caption: "Today, Your Big Day 🎂" },
  { img: "https://drive.google.com/thumbnail?id=1xUkO5-u5UJ02wfPVQ3JjmMK5eDgrxkWN&sz=w1000", caption: "That Look ✨" }
];

const BALANCE = [
  { label: "Smile", value: "100%", pct: 100 },
  { label: "Funny Moments", value: "97%", pct: 97 },
  { label: "Late Replies", value: "09%", pct: 9 },
  { label: "Voice", value: "93%", pct: 93 }
];

async function sendToTelegram(message) {
  const url = `https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`;
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: TG_CHAT_ID, text: message, parse_mode: "HTML" })
    });
    return res.ok;
  } catch (e) { return false; }
}

/* =====================================================
   STATE & MUSIC
   ===================================================== */
const state = { unlocked: false, loading: false, page: 0, letterView: "envelope", musicOn: false };
let audioPlayer = null;

function initAudio() {
  if (!audioPlayer) {
    audioPlayer = new Audio("https://drive.google.com/uc?export=download&id=1JTtZbGdqotNwUp6M3JkU8j-TPXBaHZ2I");
    audioPlayer.loop = true;
  }
}
function startMusic() {
  initAudio();
  state.musicOn = true;
  const p = audioPlayer.play();
  if (p && p.catch) p.catch(() => {});
  updateMusicButton();
}
function stopMusic() {
  state.musicOn = false;
  if (audioPlayer) audioPlayer.pause();
  updateMusicButton();
}
function updateMusicButton() {
  const btn = document.getElementById("music-button");
  if (!btn) return;
  btn.innerHTML = state.musicOn
    ? '<span style="font-size:16px">🔊</span><span>Music On</span>'
    : '<span style="font-size:16px">🔇</span><span>Music Off</span>';
}

/* =====================================================
   COUNTDOWN LOGIC
   ===================================================== */
let countdownInterval = null;

function checkCountdown() {
  const targetTime = new Date(TARGET_DATE).getTime();
  const now = new Date().getTime();
  const distance = targetTime - now;

  if (distance <= 0) {
    clearInterval(countdownInterval);
    state.unlocked = false;
    state.loading = false;
    state.page = 0;
    render();
  } else {
    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    const cdDays = document.getElementById('cd-days');
    const cdHours = document.getElementById('cd-hours');
    const cdMins = document.getElementById('cd-mins');
    const cdSecs = document.getElementById('cd-secs');
    
    if (cdDays) {
      cdDays.textContent = String(days).padStart(2, '0');
      cdHours.textContent = String(hours).padStart(2, '0');
      cdMins.textContent = String(minutes).padStart(2, '0');
      cdSecs.textContent = String(seconds).padStart(2, '0');
    }
  }
}

function renderCountdownPage() {
  app.innerHTML = `
  <div class="countdown-page">
    <div class="countdown-display">
      <div><span class="num" id="cd-days">00</span><br><span class="label">DAYS</span></div> 
      <div><span class="num" id="cd-hours">00</span><br><span class="label">HRS</span></div> 
      <div><span class="num" id="cd-mins">00</span><br><span class="label">MINS</span></div> 
      <div><span class="num" id="cd-secs">00</span><br><span class="label">SECS</span></div>
    </div>
    <div class="countdown-label">WAITING FOR YOUR SPECIAL DAY</div>
  </div>`;
  
  if (countdownInterval) clearInterval(countdownInterval);
  checkCountdown();
  countdownInterval = setInterval(checkCountdown, 1000);
}

/* =====================================================
   RENDER CORE
   ===================================================== */
const app = document.getElementById("app");
function render() {
  if (!state.unlocked) {
    app.innerHTML = state.loading ? loadingScreenHTML() : lockScreenHTML();
    if (!state.loading) bindLockScreen();
    return;
  }
  app.innerHTML = experienceShellHTML();
  bindExperienceShell();
  renderPage();
}

function lockScreenHTML() {
  return `
  <main class="lock-screen-new">
    <div class="lock-card-new">
      <h1>🎂 Happy Birthday! 🎂</h1>
      <p class="intro">Wishing you a day filled with love, laughter, and everything that makes you smile. May this year bring you happiness, success, and unforgettable memories.</p>
      <div class="emoji-row">🎉🎈🎁</div>
      <p class="quote">"Count your life by smiles, not tears. Count your age by friends, not years."</p>
      <button class="surprise-btn" id="surprise-btn" type="button">Click for a Surprise 🎊</button>
      <p id="surprise-msg" class="hidden">You are amazing! Have the best birthday ever! 💖</p>
    </div>
  </main>`;
}

function bindLockScreen() {
  const btn = document.getElementById("surprise-btn");
  const msg = document.getElementById("surprise-msg");
  if (!btn || !msg) return;
  btn.addEventListener("click", () => {
    msg.classList.remove("hidden");
    msg.classList.add("surprise-pulse");
    if (window.confetti) {
      window.confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      setTimeout(() => {
        window.confetti({ particleCount: 100, spread: 120, origin: { x: 0.1 } });
        window.confetti({ particleCount: 100, spread: 120, origin: { x: 0.9 } });
      }, 300);
    }
    btn.textContent = "Opening your surprise… 💝";
    btn.disabled = true;

function handleNavBack() {
  if (state.page === 1 && state.letterView === "letter") { state.letterView = "envelope"; renderPage(); return; }

function handleNavForward() {
  if (state.page === 1 && state.letterView === "envelope") { state.letterView = "letter"; renderPage(); return; }
  if (state.page === 1 && state.letterView === "letter") { state.page = 2; renderPage(); return; }
  if (state.page < pages.length - 1) { state.page = state.page + 1; state.letterView = "envelope"; renderPage(); }
  else { state.page = 0; state.letterView = "envelope"; renderPage(); }
}

function renderPage() {
  const stage = document.getElementById("page-stage");
  if (!stage) return;
  let html = "";
  if (state.page === 0) html = WelcomePage();
  else if (state.page === 1) html = state.letterView === "letter" ? LetterPage() : EnvelopePage();
  else if (state.page === 2) html = ScratchPage();
  else if (state.page === 3) html = AtmPage();
  else if (state.page === 4) html = CutCakePage();
  else if (state.page === 5) html = AcceptGiftPage();

  stage.innerHTML = html;
  stage.style.animation = "none"; void stage.offsetWidth; stage.style.animation = "";

  const t = document.getElementById("page-title");
  if (t) {
    if (state.page === 1) t.textContent = state.letterView === "letter" ? "A Love Letter" : "Envelope";
    else t.textContent = pages[state.page];
  }
  const b = document.getElementById("nav-back"); if (b) b.disabled = state.page === 0;
  const f = document.getElementById("nav-forward");
  
  if (f) {
    if (state.page === 1 && state.letterView === "envelope") f.innerHTML = 'Open Letter <span>💌</span>';
    else if (state.page < pages.length - 1) f.innerHTML = 'Continue <span>❤️</span>';
    else f.innerHTML = 'Again <span>🔄</span>';
    f.onclick = handleNavForward;
  }
  
  bindPageInteractions();
}

function bindScratchPage() {
  const area = document.getElementById("scratch-area");
  const canvas = document.getElementById("scratch-canvas");
  const copy = document.getElementById("scratch-copy");
  if (!canvas || !area) return;
  const ctx = canvas.getContext("2d"); if (!ctx) return;
  let revealed = false, scratching = false, ro = null;

  const drawOverlay = () => {
    const r = window.devicePixelRatio || 1;
    const w = area.clientWidth, h = area.clientHeight;
    if (w < 2 || h < 2) return;
    canvas.width = Math.round(w * r); canvas.height = Math.round(h * r);
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    ctx.setTransform(r, 0, 0, r, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#d6b48c"; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#fff8ed"; ctx.font = "600 15px Georgia";
    ctx.textAlign = "center"; ctx.fillText("SCRATCH ME", w / 2, h / 2);
    for (let i = 0; i < 34; i++) {
      ctx.fillStyle = i % 2 ? "#f7d1cf" : "#b85f68";
      ctx.beginPath(); ctx.arc(Math.random() * w, Math.random() * h, 2.2, 0, Math.PI * 2); ctx.fill();
    }
  };
  requestAnimationFrame(() => requestAnimationFrame(drawOverlay));
  if (window.ResizeObserver) { ro = new ResizeObserver(() => { if (!revealed) drawOverlay(); }); ro.observe(area); }

  const scratch = (e) => {
    if (!scratching) return;
    const b = canvas.getBoundingClientRect();
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath(); ctx.arc(e.clientX - b.left, e.clientY - b.top, 26, 0, Math.PI * 2); ctx.fill();
    if (!revealed) {
      revealed = true;
      if (ro) ro.disconnect();
      if (copy) copy.textContent = "Keep going, your prize is appearing! ❤️";
    }
  };
  canvas.addEventListener("pointerdown", (e) => {
    scratching = true;
    try { if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener("pointermove", scratch);
  canvas.addEventListener("pointerup", () => { scratching = false; });
  canvas.addEventListener("pointercancel", () => { scratching = false; });
}

function bindAtm() {
  const stage = document.getElementById("atm-stage");

  const toast = document.getElementById("atm-toast");

  const receipt = document.getElementById("receipt-paper");
  const door = document.getElementById("atm-door");
  if (!screen || !toast || !cardEl || !slot || !keypad || !receipt || !door) return;

  const timers = [];
  const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
  const every = (fn, ms) => { const id = setInterval(fn, ms); timers.push(id); return id; };
  const stopAll = () => timers.forEach(t => { clearTimeout(t); clearInterval(t); });
  every(() => { if (!document.body.contains(stage)) stopAll(); }, 800);

  const s = { step: "insert", progress: 0, pin: "", memoryIndex: 0, viewed: 1, wish: "", card: "idle", receiptOut: 0, receiptTaken: false, nagCard: false, balanceShown: false };

  const flash = (msg) => { toast.textContent = msg; toast.classList.remove("hidden"); later(() => toast.classList.add("hidden"), 1600); };

    switch (s.step) {

      case "reading": return `<h4>READING CARD…</h4><div class="atm-progress"><span style="width:${s.progress}%"></span></div><p>Please Wait…</p>`;
      case "pin": case "pinWrong":
        return `<h4>ENTER PIN</h4>
          <div class="pin-dots">${[0,1,2,3].map(i => `<i class="${i < s.pin.length ? "filled" : ""}"></i>`).join("")}</div>
          ${s.step === "pinWrong" ? `<p style="color:#ff9a92">❌ Incorrect PIN</p>` : `<p>Use the keypad, then ENTER</p>`}
          <small>hint: day + month of your birthday</small>`;
      case "pinOk": return `<h4>✅ WELCOME BACK</h4><p>Authenticating photos…</p>`;
      case "menu":
        return `<h4>PHOTO BANK</h4>
          <div class="atm-menu">

              `<button class="atm-menu-row" data-menu="${i+1}"><b>${i+1} ${l}</b><em>◀</em></button>`
            ).join("")}
          </div>
          <small>tap an option or press its number</small>`;
      case "vault": return `<h4>ACCESSING PHOTO VAULT…</h4><div class="atm-progress"><span style="width:${s.progress}%"></span></div>`;
      case "memories": {
        const m = MEMORIES[s.memoryIndex] || MEMORIES[0];

        return `<small>Photo ${s.memoryIndex+1}/${MEMORIES.length}</small>

          <p>"${m.caption}"</p>
          <div class="atm-nav-row">
            <button class="atm-nav" data-act="prev">◀ Previous</button>
            <button class="atm-nav" data-act="next">${last ? "Menu ▶" : "Next ▶"}</button>
          </div>`;
      }
      case "checking": return `<h4>CHECKING ACCOUNT…</h4><p>▚▚▚▚▚▚▚▚</p>`;
      case "balance":
        return `<h4>LOVE BALANCE</h4>

          </div>
          <div class="atm-nav-row"><button class="atm-nav" data-act="menu">◀ Back to Menu</button></div>`;

  function railLabels(side) {
    const e = [null,null,null,null];

      receipt.style.transform = `translateX(-50%) scaleY(${Math.max(0.02, s.receiptOut/100)})`;
      receipt.style.opacity = "1";
    }
    door.classList.toggle("hidden", s.step !== "door");
  }

  const go = (step) => { s.step = step; paint(); };

  function insertCard() {
    if (s.card !== "idle" || s.step !== "insert") return;
    s.card = "inserting"; paint(false); flash("Card accepted • beep");
    later(() => {
      s.card = "gone"; s.step = "reading"; s.progress = 0; paint();
      const t = every(() => {
        s.progress = Math.min(100, s.progress + 7); paint(false);
        if (s.progress >= 100) { clearInterval(t); later(() => go("pin"), 500); }
      }, 110);
    }, 1500);
  }

  function pressKey(k) {
    if (s.step === "pin" || s.step === "pinWrong") {
      if (k === "C") { s.pin = ""; return paint(false); }
      if (k === "E") {
        const entered = s.pin; s.pin = "";
        if (entered === ATM_PIN) { go("pinOk"); later(() => go("menu"), 1400); }
        else { go("pinWrong"); later(() => go("pin"), 1500); }
        return;
      }
      if (s.pin.length < 4) { s.pin += k; paint(false); }
      return;
    }
    if (s.step === "menu" && ["1","2","3","4"].includes(k)) selectMenu(Number(k));
  }

  function selectMenu(o) {
    if (o === 1) {
      s.progress = 0; go("vault");
      const t = every(() => {
        s.progress = Math.min(100, s.progress + 10); paint(false);
        if (s.progress >= 100) { clearInterval(t); later(() => { s.memoryIndex = 0; go("memories"); }, 400); }
      }, 90);
    } else if (o === 2) {
      s.balanceShown = false; go("checking");
      later(() => { go("balance"); later(() => { s.balanceShown = true; paint(false); }, 200); }, 1600);
    } else if (o === 3) go("wish");
    else go("exitAsk");
  }

  function nextM() { const n = Math.min(MEMORIES.length - 1, s.memoryIndex + 1); s.memoryIndex = n; s.viewed = Math.max(s.viewed, n + 1); paint(); }
  function prevM() { s.memoryIndex = Math.max(0, s.memoryIndex - 1); paint(); }

  function endSession() {
    s.receiptOut = 0; s.receiptTaken = false; go("receipt");
    const t = every(() => { s.receiptOut += 4; paint(false); if (s.receiptOut >= 100) clearInterval(t); }, 90);
  }
  function takeReceipt() {
    if (s.receiptOut < 96) return flash("Still printing…");
    if (s.receiptTaken) return;
    s.receiptTaken = true;
    receipt.classList.add("pulled");
    receipt.style.transform = "translateX(-50%) translate(70px, 160px) rotate(8deg)";
    receipt.style.opacity = "0";
    later(() => { s.card = "returning"; go("cardReturn"); later(() => { s.nagCard = true; paint(false); }, 4000); }, 500);
  }
  function takeCard() {
    if (s.step !== "cardReturn") return;
    s.card = "taken"; s.nagCard = false; paint(false);
    later(() => {
      go("thanks");
      later(() => {
        go("door");
        later(() => { const f = document.getElementById("nav-forward"); if (f) f.click(); }, 1800);
      }, 2600);
    }, 600);
  }

  function sideButton(i, side) {
    if (s.step === "menu") { if (side === "left") selectMenu(i + 1); return; }
    if (s.step === "memories") {
      if (side === "left" && i === 3) prevM();
      if (side === "right" && i === 3) { if (s.memoryIndex === MEMORIES.length - 1) go("menu"); else nextM(); }
      return;
    }
    if (s.step === "balance" && i === 3) return go("menu");
    if (s.step === "wishDone" && i === 3) return go("menu");
    if (s.step === "exitAsk") {
      if (side === "left" && i === 3) endSession();
      if (side === "right" && i === 3) go("menu");
    }
  }

  keypad.addEventListener("click", (e) => { const b = e.target.closest("[data-key]"); if (b) pressKey(b.dataset.key); });
  stage.addEventListener("click", (e) => {
    const sb = e.target.closest(".side-btn"); if (sb && !sb.disabled) return sideButton(Number(sb.dataset.index), sb.dataset.side);
    const mr = e.target.closest("[data-menu]"); if (mr) return selectMenu(Number(mr.dataset.menu));
    const a = e.target.closest("[data-act]");
    if (a) {
      const w = a.dataset.act;
      if (w === "prev") return prevM();
      if (w === "next") return s.memoryIndex === MEMORIES.length - 1 ? go("menu") : nextM();
      if (w === "menu") return go("menu");
      if (w === "end") return endSession();
      if (w === "confirm-wish") {
        const inp = document.getElementById("atm-wish");
        const v = inp ? inp.value.trim() : "";
        if (!v) return; 
        s.wish = v; 
        sendToTelegram(`<b>New Wish from ${NAME}:</b>\n\n${v}`);
        return go("wishDone");
      }
    }
  });
  screen.addEventListener("input", (e) => { if (e.target.id === "atm-wish") s.wish = e.target.value; });
  slot.addEventListener("click", insertCard);
  cardEl.addEventListener("click", () => s.step === "cardReturn" ? takeCard() : insertCard());
  cardEl.addEventListener("keydown", (e) => { if (e.key === "Enter") s.step === "cardReturn" ? takeCard() : insertCard(); });
  receipt.addEventListener("click", takeReceipt);
  receipt.addEventListener("pointerup", takeReceipt);

  paint();
}

function CutCakePage() {
  setTimeout(bindCutCake, 0);
  return `
  <div class="chapter-page page-content">

function bindCutCake() {
  const wrap = document.getElementById("cutcake-stage");
  const canvas = document.getElementById("cutcake-canvas");
  if (!wrap || !canvas) return;
  const knife = document.getElementById("cake-knife");
  const heading = document.getElementById("cake-heading");
  const cb = document.getElementById("cake-candles-btn");
  const db = document.getElementById("cake-done-btn");
  const ce = document.getElementById("cut-count");
  const he = document.getElementById("cut-help");

  let candlesOut = false, cuts = [], dragStart = null;
  const cream = [];
  const pieces = () => (cuts.length === 0 ? 1 : cuts.length * 2);

  function draw() {
    const r = window.devicePixelRatio || 1;
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (w < 2 || h < 2) return;
    canvas.width = Math.round(w * r); canvas.height = Math.round(h * r);
    const ctx = canvas.getContext("2d"); if (!ctx) return;
    ctx.setTransform(r, 0, 0, r, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2, rad = Math.min(w, h) * 0.33;

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy + 12, rad * 1.42, rad * 1.3, 0, 0, Math.PI * 2);
    const plate = ctx.createRadialGradient(cx, cy, rad * 0.4, cx, cy, rad * 1.45);
    plate.addColorStop(0, "#fffdf8"); plate.addColorStop(1, "#e8dccd");
    ctx.fillStyle = plate; ctx.shadowColor = "rgba(37,25,29,.22)"; ctx.shadowBlur = 26; ctx.shadowOffsetY = 14;
    ctx.fill(); ctx.restore();

    const angles = cuts.length ? cuts.reduce((a, v) => a.concat([v, v + Math.PI]), [])
      .map(a => ((a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2)).sort((a, b) => a - b) : [];
    const wedges = [];
    if (angles.length === 0) wedges.push([0, Math.PI * 2]);
    else for (let i = 0; i < angles.length; i++) {
      const st = angles[i];
      const en = i === angles.length - 1 ? angles[0] + Math.PI * 2 : angles[i + 1];
      wedges.push([st, en]);
    }

    wedges.forEach(([st, en]) => {
      const mid = (st + en) / 2;
      const spread = cuts.length ? Math.min(10, 3 + cuts.length * 2) : 0;
      const ox = Math.cos(mid) * spread, oy = Math.sin(mid) * spread;

      ctx.save(); ctx.translate(ox, oy + 16);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, rad, st, en); ctx.closePath();
      ctx.fillStyle = "#c98d63"; ctx.fill(); ctx.restore();

      ctx.save(); ctx.translate(ox, oy);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, rad, st, en); ctx.closePath();
      const top = ctx.createRadialGradient(cx - rad * 0.3, cy - rad * 0.4, rad * 0.1, cx, cy, rad);
      top.addColorStop(0, "#fbe3e0"); top.addColorStop(0.55, "#f2c6c4"); top.addColorStop(1, "#d99a9c");
      ctx.fillStyle = top; ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = "#fff8ed";
      ctx.beginPath(); ctx.arc(cx, cy, rad - 4, st, en); ctx.stroke();
      if (cuts.length) {
        ctx.strokeStyle = "rgba(123,57,68,.35)"; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(st) * rad, cy + Math.sin(st) * rad);
        ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(en) * rad, cy + Math.sin(en) * rad);
        ctx.stroke();
      }
      ctx.restore();
    });

    if (cuts.length === 0) {
      ctx.save();
      ctx.fillStyle = "#7b3944";
      ctx.font = `600 ${Math.round(rad * 0.42)}px Georgia`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("🎂", cx, cy);
      ctx.restore();
    }

    if (!candlesOut) {
      [-0.5, 0.5].forEach(off => {
        const x = cx + off * rad * 0.5, y = cy - rad * 0.55;
        ctx.fillStyle = "#fff8ed"; ctx.fillRect(x - 4, y - 40, 8, 44);
        ctx.fillStyle = "#b85f68"; ctx.fillRect(x - 4, y - 30, 8, 5);
        ctx.beginPath(); ctx.ellipse(x, y - 48, 6, 11, 0, 0, Math.PI * 2);
        const fl = ctx.createRadialGradient(x, y - 46, 1, x, y - 48, 12);
        fl.addColorStop(0, "#fff3c4"); fl.addColorStop(0.5, "#ffb648"); fl.addColorStop(1, "rgba(255,120,40,0)");
        ctx.fillStyle = fl; ctx.fill();
      });
    }

    cream.forEach(b => {
      ctx.save(); ctx.globalAlpha = b.a; ctx.fillStyle = "#fff8ed";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    });
  }

  const onResize = () => { if (!document.body.contains(canvas)) { window.removeEventListener("resize", onResize); return; } draw(); };
  window.addEventListener("resize", onResize);
  requestAnimationFrame(() => requestAnimationFrame(draw));

  function refresh() {
    ce.textContent = `Pieces: ${pieces()}`;
    ce.classList.toggle("hidden", !candlesOut);
    he.textContent = candlesOut ? "drag the knife right across the cake to slice it" : "candles are still burning";
    heading.textContent = candlesOut ? "Now cut the cake 🍰" : "Blow out the candles first";
    db.classList.toggle("hidden", pieces() < 4);
  }

  cb.addEventListener("click", () => {
    candlesOut = true; cb.classList.add("hidden");
    knife.classList.remove("hidden"); refresh(); draw();
  });

  wrap.addEventListener("pointerdown", (e) => {
    if (!candlesOut) return;
    const b = wrap.getBoundingClientRect();
    dragStart = { x: e.clientX - b.left, y: e.clientY - b.top };
    try { if (e.target.setPointerCapture) e.target.setPointerCapture(e.pointerId); } catch (err) {}
  });
  wrap.addEventListener("pointermove", (e) => {
    if (!candlesOut) return;
    const b = wrap.getBoundingClientRect();
    const x = e.clientX - b.left, y = e.clientY - b.top;
    let rot = 0;
    if (dragStart) {
      const dx = x - dragStart.x, dy = y - dragStart.y;
      rot = (Math.atan2(dy, dx) * 180) / Math.PI - 90;
      cream.push({ x, y, r: 2 + Math.random() * 4, a: 0.5 + Math.random() * 0.4 });
      if (cream.length > 160) cream.shift();
      draw();
    }
    knife.style.left = `${x - 17}px`; knife.style.top = `${y - 30}px`;
    knife.style.right = "auto"; knife.style.transform = `rotate(${rot}deg)`;
  });
  const endCut = (e) => {
    if (!dragStart) return;
    const b = wrap.getBoundingClientRect();
    const x = e.clientX - b.left, y = e.clientY - b.top;
    const dx = x - dragStart.x, dy = y - dragStart.y;
    dragStart = null;
    if (Math.hypot(dx, dy) < 60) return;
    if (cuts.length < 6) cuts = cuts.concat([Math.atan2(dy, dx)]);
    if (navigator.vibrate) navigator.vibrate(40);
    refresh(); draw();
  };
  wrap.addEventListener("pointerup", endCut);
  wrap.addEventListener("pointercancel", () => { dragStart = null; });

  db.addEventListener("click", () => { const f = document.getElementById("nav-forward"); if (f) f.click(); });
  refresh();
}

/* =====================================================
   ENHANCE
   ===================================================== */
function typewrite(el, speed) {
  if (!el || el.dataset["typed"]) return;
  const text = el.dataset["fullText"] || el.textContent || "";
  el.dataset["typed"] = "1";
  el.textContent = ""; el.classList.add("bdy-type", "bdy-typing");
  let i = 0; const sp = speed || 9;
  const step = () => {
    if (!document.body.contains(el)) return;
    i = Math.min(text.length, i + 1);
    el.textContent = text.slice(0, i);
    if (i < text.length) {
      const ch = text[i - 1];
      let d = sp;
      if (ch === "." || ch === "!" || ch === "?") d = sp + 40;
      else if (ch === ",") d = sp + 20;
      setTimeout(step, d);
    } else {
      el.classList.remove("bdy-typing");
      el.dispatchEvent(new CustomEvent("bdy:typed", { bubbles: true }));
    }
  };
  setTimeout(step, 60);
}
function typeSequence(nodes, speed) {
  let i = 0;
  const next = () => { const el = nodes[i]; if (!el) return; i++; el.addEventListener("bdy:typed", next, { once: true }); typewrite(el, speed); };
  next();
}
function decorate() {
  const lb = document.getElementById("letter-body");
  if (lb && !lb.dataset["prepped"]) {
    lb.dataset["prepped"] = "1";
    const items = Array.prototype.slice.call(lb.querySelectorAll("p, strong"));
    items.forEach(el => { el.dataset["fullText"] = el.textContent || ""; el.textContent = ""; el.classList.add("bdy-type"); });
    typeSequence(items, 9);
  }
}
window.__bdyDecorate = decorate;
document.addEventListener("bdy:retype", decorate);

document.addEventListener("click", (event) => {
  const t = event.target;
  if (!(t instanceof Element)) return;
  if (!t.closest("button, .atm-card, .scratch-area, .game-card")) return;
  for (let i = 0; i < 4; i++) {
    const h = document.createElement("span");
    h.className = "bdy-heart-pop";
    h.textContent = i % 2 ? "💗" : "❤️";
    h.style.left = event.clientX - 10 + (Math.random() * 46 - 23) + "px";
    h.style.top = event.clientY - 12 + "px";
    h.style.animationDelay = i * 80 + "ms";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1600);
  }
});

  const targetTime = new Date(TARGET_DATE).getTime();
  const now = new Date().getTime();

  if (now < targetTime) {
    renderCountdownPage();
  } else {
    render();
  }
}
